[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "videodna"
version = "1.0.0"
description = "10x Video Reverse-Engineering, Viral Retention X-Ray & Beat-The-Original Blueprint Engine for Short & Long Videos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "VideoDNA" }]
keywords = [
  "video-analysis",
  "reverse-engineering",
  "viral-video",
  "ai-agent",
  "claude-code",
  "antigravity",
  "retention-analysis",
  "shorts",
  "youtube"
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
]

[project.optional-dependencies]
url = ["yt-dlp>=2024.8.0"]
ai = ["requests>=2.28"]
all = ["yt-dlp>=2024.8.0", "requests>=2.28"]

[project.scripts]
videodna = "videodna.cli:main"

[tool.setuptools.packages.find]
include = ["videodna*"]
